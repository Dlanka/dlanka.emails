<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════╗
  ║  Ingoude Company — Professional HTML Email Signature     ║
  ║  Sample 3 of Darshaka Lanka Email Development Portfolio  ║
  ║                                                          ║
  ║  Features:                                               ║
  ║  - Email-safe table layout (Outlook/Gmail compatible)    ║
  ║  - Hosted HTTPS image assets                             ║
  ║  - Clickable phone (tel:), email (mailto:), and website  ║
  ║  - Responsive max-width container                        ║
  ╚══════════════════════════════════════════════════════════╝
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingoude Company — Email Signature</title>
</head>
<body style="margin:0; padding:0; background:#ffffff; font-family:Arial, Helvetica, sans-serif;">

<!--
  ─────────────────────────────────────────────────────────
  EMAIL SIGNATURE — Copy everything inside the outer table
  when pasting into your email client's signature editor.
  ─────────────────────────────────────────────────────────
-->

<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="100%"
  style="max-width:540px; min-width:320px; font-family:Arial, Helvetica, sans-serif; border-collapse:collapse; background-color:#ffffff; mso-table-lspace:0pt; mso-table-rspace:0pt; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden;">

  <tr>
    <!-- ─── LEFT COLUMN: Blue decorative banner with avatar ──────── -->
    <td
      width="150"
      valign="middle"
      style="width:150px; background-color:#0050c8; background-image:url('https://dlanka-emails.pages.dev/Ingoude-assets/left-bg-pattern.png'); background-repeat:no-repeat; background-position:center left; background-size:cover; text-align:center; padding:24px 12px;">
      
      <!-- Profile Photo inside crisp white circular ring -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto; border-collapse:collapse;">
        <tr>
          <td style="padding:0; text-align:center;">
            <img
              src="https://dlanka-emails.pages.dev/Ingoude-assets/profile-img.png"
              alt="Jonathan Patterson, Marketing Manager at Ingoude Company"
              width="96"
              height="96"
              style="width:96px; height:96px; border-radius:50%; border:4px solid #ffffff; display:block; margin:0 auto; object-fit:cover; outline:none; text-decoration:none;" />
          </td>
        </tr>
      </table>
    </td>

    <!-- ─── RIGHT COLUMN: Info & Contact details ─────────────────── -->
    <td valign="top" style="padding:22px 24px 22px 20px; background-color:#ffffff;">

      <!-- Company Wordmark -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
        <tr>
          <td style="padding:0 8px 0 0; vertical-align:middle; line-height:0;">
            <img
              src="https://dlanka-emails.pages.dev/Ingoude-assets/cmp-logo.png"
              alt="Ingoude Company Logo"
              width="24"
              height="24"
              style="width:24px; height:24px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:0; vertical-align:middle; font-size:14px; font-weight:700; color:#1e293b; letter-spacing:0.3px; line-height:1.2;">
            Ingoude Company
          </td>
        </tr>
      </table>

      <!-- Name -->
      <h2 style="margin:12px 0 2px 0; font-size:22px; font-weight:800; color:#0050c8; line-height:1.2; letter-spacing:-0.4px;">
        Jonathan Patterson
      </h2>

      <!-- Job Title -->
      <p style="margin:0 0 14px 0; font-size:13px; font-weight:600; font-style:italic; color:#0050c8; letter-spacing:0.2px; line-height:1.2;">
        Marketing Manager
      </p>

      <!-- Contact Rows Table -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
        <!-- Website Row -->
        <tr>
          <td width="22" style="width:22px; padding:3px 8px 3px 0; vertical-align:middle; line-height:0;">
            <img
              src="https://dlanka-emails.pages.dev/Ingoude-assets/icon-world.png"
              alt="Website"
              width="15"
              height="15"
              style="width:15px; height:15px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:3px 0; font-size:12px; color:#1e293b; vertical-align:middle; line-height:1.4;">
            <a href="https://www.reallygreatsite.com" target="_blank" rel="noopener noreferrer" style="color:#1e293b; text-decoration:none; font-weight:500;">
              www.reallygreatsite.com
            </a>
          </td>
        </tr>

        <!-- Phone Row -->
        <tr>
          <td width="22" style="width:22px; padding:3px 8px 3px 0; vertical-align:middle; line-height:0;">
            <img
              src="https://dlanka-emails.pages.dev/Ingoude-assets/icon-phone.png"
              alt="Phone"
              width="15"
              height="15"
              style="width:15px; height:15px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:3px 0; font-size:12px; color:#1e293b; vertical-align:middle; line-height:1.4;">
            <a href="tel:123-456-7890" style="color:#1e293b; text-decoration:none; font-weight:500;">
              123-456-7890
            </a>
          </td>
        </tr>

        <!-- Email Row -->
        <tr>
          <td width="22" style="width:22px; padding:3px 8px 3px 0; vertical-align:middle; line-height:0;">
            <img
              src="https://dlanka-emails.pages.dev/Ingoude-assets/icon-mail.png"
              alt="Email"
              width="15"
              height="15"
              style="width:15px; height:15px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:3px 0; font-size:12px; color:#1e293b; vertical-align:middle; line-height:1.4;">
            <a href="mailto:hello@reallygreatsite.com" style="color:#1e293b; text-decoration:none; font-weight:500;">
              hello@reallygreatsite.com
            </a>
          </td>
        </tr>

        <!-- Address Row -->
        <tr>
          <td width="22" style="width:22px; padding:3px 8px 3px 0; vertical-align:middle; line-height:0;">
            <img
              src="https://dlanka-emails.pages.dev/Ingoude-assets/icon-location.png"
              alt="Address"
              width="15"
              height="15"
              style="width:15px; height:15px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:3px 0; font-size:12px; color:#1e293b; vertical-align:middle; line-height:1.4; font-weight:500;">
            123 Anywhere St., Any City
          </td>
        </tr>
      </table>

    </td>
  </tr>

</table>

</body>
</html>
