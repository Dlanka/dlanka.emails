<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ingoude Signature Test</title>
</head>
<body style="background:#0f172a; padding:40px; font-family:Arial, sans-serif;">

<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  width="100%"
  style="max-width:540px; min-width:320px; font-family:Arial, Helvetica, sans-serif; border-collapse:collapse; background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">

  <tr>
    <!-- ─── 1. Far Left Blue Banner ─── -->
    <td
      width="50"
      valign="middle"
      style="width:50px; background-color:#0050c8; background-image:url('/Ingoude-assets/left-bg-pattern.png'); background-repeat:no-repeat; background-position:center left; background-size:cover; padding:0; line-height:0; font-size:0;">
      &nbsp;
    </td>

    <!-- ─── 2. Avatar Seam Column (Half Blue, Half White) ─── -->
    <td
      width="140"
      valign="middle"
      align="center"
      style="width:140px; background-color:#0050c8; background: linear-gradient(to right, #0050c8 50%, #ffffff 50%); padding:20px 0; text-align:center; vertical-align:middle;">
      
      <img
        src="/Ingoude-assets/profile-img.png"
        alt="Jonathan Patterson"
        width="130"
        height="130"
        style="width:130px; height:130px; display:block; margin:0 auto; border:0; outline:none; -ms-interpolation-mode:bicubic;" />
    </td>

    <!-- ─── 3. Right Content Column ─── -->
    <td valign="top" style="padding:22px 24px 22px 14px; background-color:#ffffff;">

      <!-- Company Wordmark -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="padding:0 8px 0 0; vertical-align:middle; line-height:0;">
            <img
              src="/Ingoude-assets/cmp-logo.png"
              alt="Ingoude Company Logo"
              width="24"
              height="24"
              style="width:24px; height:24px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:0; vertical-align:middle; font-size:14px; font-weight:700; color:#1e293b; letter-spacing:0.3px; line-height:1.2;">
            Ingoude Company
          </td>
        </tr>
      </table>

      <!-- Name -->
      <h2 style="margin:12px 0 2px 0; font-size:22px; font-weight:800; color:#0050c8; line-height:1.2; letter-spacing:-0.4px;">
        Jonathan Patterson
      </h2>

      <!-- Job Title -->
      <p style="margin:0 0 14px 0; font-size:13px; font-weight:600; font-style:italic; color:#0050c8; letter-spacing:0.2px; line-height:1.2;">
        Marketing Manager
      </p>

      <!-- Contact Rows Table -->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td width="22" style="width:22px; padding:3px 8px 3px 0; vertical-align:middle; line-height:0;">
            <img
              src="/Ingoude-assets/icon-world.png"
              alt="Website"
              width="15"
              height="15"
              style="width:15px; height:15px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:3px 0; font-size:12px; color:#1e293b; vertical-align:middle; line-height:1.4;">
            <a href="https://www.reallygreatsite.com" target="_blank" rel="noopener noreferrer" style="color:#1e293b; text-decoration:none; font-weight:500;">
              www.reallygreatsite.com
            </a>
          </td>
        </tr>

        <tr>
          <td width="22" style="width:22px; padding:3px 8px 3px 0; vertical-align:middle; line-height:0;">
            <img
              src="/Ingoude-assets/icon-phone.png"
              alt="Phone"
              width="15"
              height="15"
              style="width:15px; height:15px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:3px 0; font-size:12px; color:#1e293b; vertical-align:middle; line-height:1.4;">
            <a href="tel:123-456-7890" style="color:#1e293b; text-decoration:none; font-weight:500;">
              123-456-7890
            </a>
          </td>
        </tr>

        <tr>
          <td width="22" style="width:22px; padding:3px 8px 3px 0; vertical-align:middle; line-height:0;">
            <img
              src="/Ingoude-assets/icon-mail.png"
              alt="Email"
              width="15"
              height="15"
              style="width:15px; height:15px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:3px 0; font-size:12px; color:#1e293b; vertical-align:middle; line-height:1.4;">
            <a href="mailto:hello@reallygreatsite.com" style="color:#1e293b; text-decoration:none; font-weight:500;">
              hello@reallygreatsite.com
            </a>
          </td>
        </tr>

        <tr>
          <td width="22" style="width:22px; padding:3px 8px 3px 0; vertical-align:middle; line-height:0;">
            <img
              src="/Ingoude-assets/icon-location.png"
              alt="Address"
              width="15"
              height="15"
              style="width:15px; height:15px; display:block; border:0; outline:none;" />
          </td>
          <td style="padding:3px 0; font-size:12px; color:#1e293b; vertical-align:middle; line-height:1.4; font-weight:500;">
            123 Anywhere St., Any City
          </td>
        </tr>
      </table>

    </td>
  </tr>

</table>

</body>
</html>
